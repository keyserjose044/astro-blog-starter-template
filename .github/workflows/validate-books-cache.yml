name: Validate Books Asset Cache Fix

on:
  push:
    branches:
      - fix/books-asset-cache
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
      RAINDROP_COLLECTION_BOOKS_ID: ${{ secrets.RAINDROP_COLLECTION_BOOKS_ID }}
      RAINDROP_COLLECTION_ALBUMS_ID: ${{ secrets.RAINDROP_COLLECTION_ALBUMS_ID }}
      RAINDROP_COLLECTION_ART_ID: ${{ secrets.RAINDROP_COLLECTION_ART_ID }}
      RAINDROP_COLLECTION_COMPOSERS_ID: ${{ secrets.RAINDROP_COLLECTION_COMPOSERS_ID }}
      CLASSICAL_LISTENING_DATA_URL: ${{ secrets.CLASSICAL_LISTENING_DATA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: node --check public/scripts/books-atlas-insights.js
      - run: npm ci
      - run: npm run build
      - run: |
          grep -q 'lifeloggerz-books-assets' dist/books/index.html
          grep -q '20260726-1220' dist/books/index.html
