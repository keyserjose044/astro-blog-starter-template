name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"  # daily rebuild

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
      RAINDROP_COLLECTION_BOOKS_ID: ${{ secrets.RAINDROP_COLLECTION_BOOKS_ID }}
      RAINDROP_COLLECTION_ALBUMS_ID: ${{ secrets.RAINDROP_COLLECTION_ALBUMS_ID }}
      RAINDROP_COLLECTION_ART_ID: ${{ secrets.RAINDROP_COLLECTION_ART_ID }}
      RAINDROP_COLLECTION_COMPOSERS_ID: ${{ secrets.RAINDROP_COLLECTION_COMPOSERS_ID }}
      CLASSICAL_LISTENING_DATA_URL: ${{ secrets.CLASSICAL_LISTENING_DATA_URL }}
      MUSIC_LISTENING_DATA_URL: ${{ secrets.MUSIC_LISTENING_DATA_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: 🔎 Debug env presence
        run: |
          if [ -z "${RAINDROP_TOKEN}" ]; then echo "❌ RAINDROP_TOKEN missing"; exit 1; else echo "✅ RAINDROP_TOKEN present"; fi
          if [ -z "${RAINDROP_COLLECTION_BOOKS_ID}" ]; then echo "❌ RAINDROP_COLLECTION_BOOKS_ID missing"; exit 1; else echo "✅ RAINDROP_COLLECTION_BOOKS_ID present"; fi
          if [ -z "${RAINDROP_COLLECTION_COMPOSERS_ID}" ]; then echo "⚠️ RAINDROP_COLLECTION_COMPOSERS_ID missing; fallback ID will be used"; else echo "✅ RAINDROP_COLLECTION_COMPOSERS_ID present"; fi
          if [ -z "${CLASSICAL_LISTENING_DATA_URL}" ]; then echo "⚠️ CLASSICAL_LISTENING_DATA_URL missing; composer listening stats will be disabled"; else echo "✅ CLASSICAL_LISTENING_DATA_URL present"; fi
          if [ -z "${MUSIC_LISTENING_DATA_URL}" ]; then echo "⚠️ MUSIC_LISTENING_DATA_URL missing; Albums Listening Log will stay hidden"; else echo "✅ MUSIC_LISTENING_DATA_URL present"; fi

      - name: 🎵 Snapshot public music listening feed
        if: env.MUSIC_LISTENING_DATA_URL != ''
        run: |
          mkdir -p public/data
          tmp_file="$(mktemp)"
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Accept: application/json" \
            "${MUSIC_LISTENING_DATA_URL}" \
            --output "${tmp_file}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!p||!Array.isArray(p.rows))throw new Error('Music feed must contain a rows array');console.log('✅ Music listening rows:',p.rows.length);" "${tmp_file}"
          mv "${tmp_file}" public/data/music-listening.json

      - name: 🔎 Show homepage file CI is using
        run: |
          echo "---- Files in src/pages ----"
          ls -la src/pages
          echo "---- First 25 lines of src/pages/index.astro ----"
          sed -n '1,25p' src/pages/index.astro || true

      - name: 🧹 Clean caches
        run: rm -rf node_modules/.astro dist .astro

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
