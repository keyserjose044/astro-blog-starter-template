name: Validate Books Atlas Insights

on:
  push:
    branches:
      - feature/books-atlas-insights
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
      RAINDROP_COLLECTION_BOOKS_ID: ${{ secrets.RAINDROP_COLLECTION_BOOKS_ID }}
      RAINDROP_COLLECTION_ALBUMS_ID: ${{ secrets.RAINDROP_COLLECTION_ALBUMS_ID }}
      RAINDROP_COLLECTION_ART_ID: ${{ secrets.RAINDROP_COLLECTION_ART_ID }}
      RAINDROP_COLLECTION_COMPOSERS_ID: ${{ secrets.RAINDROP_COLLECTION_COMPOSERS_ID }}
      CLASSICAL_LISTENING_DATA_URL: ${{ secrets.CLASSICAL_LISTENING_DATA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: |
          node --check public/scripts/books-atlas-insights.js
          node --check public/scripts/books-atlas-insights-utils.js
          node --check public/scripts/books-atlas-insights-timeline.js
          node --check public/scripts/books-atlas-insights-map.js
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: books-atlas-preview
          path: dist
          retention-days: 1
