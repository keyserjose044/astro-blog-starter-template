name: Full site visual audit

on:
  pull_request:
    paths:
      - 'scripts/site-visual-audit.mjs'
      - 'scripts/site-visual-audit-fast.mjs'
      - '.github/workflows/full-site-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUDIT_SITE_SHA: 315ebe3ca4046a786debea99ea6228e913919909-live
      AUDIT_BASE_URL: https://lifeloggerz.com
    steps:
      - name: Check out audit tooling
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install Playwright for audit only
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build locally only to discover every generated route
        run: npm run build

      - name: Wait for and verify the latest deployed UI markers
        run: |
          for i in {1..60}; do
            about_html="$(curl --fail --silent --location https://lifeloggerz.com/about/me/ || true)"
            books_html="$(curl --fail --silent --location https://lifeloggerz.com/books/ || true)"
            if ! printf '%s' "$about_html" | grep -q 'about-family-roots-terrain-override.js' \
              && printf '%s' "$about_html" | grep -q 'Family Roots' \
              && printf '%s' "$books_html" | grep -q 'books-author-cover-stacks.js?v=20260808-1803'; then
              echo 'Latest Aug 8 UI markers are live: clean Family Roots maps + Books Authors stacks.'
              exit 0
            fi
            echo "Deployment not current yet; retry $i/60"
            sleep 5
          done
          echo 'Expected latest UI markers never appeared on lifeloggerz.com.'
          exit 1

      - name: Scan deployed site — desktop first, then mobile
        run: node scripts/site-visual-audit-fast.mjs

      - name: Print audit summary
        if: always()
        run: |
          if [ -f audit-output-fast/REPORT.md ]; then
            cat audit-output-fast/REPORT.md
          fi

      - name: Upload deployed-site screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeloggerz-live-fast-audit-315ebe3
          path: audit-output-fast
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
